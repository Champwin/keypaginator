<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>键盘翻页助手</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #6b7280;
    --line: #e5e7eb;
    --brand: #2563eb;
    --brand-soft: #eff6ff;
    --warn: #b45309;
    --warn-soft: #fffbeb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px; width: 320px;
    background: var(--bg); color: var(--fg);
    font: 13px/1.55 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
  h1 .dot { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; }
  h1 .dot.off { background: #9ca3af; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row .k { color: var(--muted); }
  .row .v { font-weight: 600; text-align: right; max-width: 62%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .v.empty { color: var(--warn); font-weight: 500; }
  .switch { position: relative; width: 40px; height: 22px; flex: 0 0 auto; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .slider { position: absolute; inset: 0; background: #d1d5db; border-radius: 22px; transition: background .18s; pointer-events: none; }
  .slider::before { content: ""; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: transform .18s; }
  .switch input:checked + .slider { background: var(--brand); }
  .switch input:checked + .slider::before { transform: translateX(18px); }
  .keys { margin-top: 8px; background: var(--brand-soft); border-radius: 8px; padding: 8px 10px; }
  .keys div { display: flex; justify-content: space-between; gap: 8px; }
  .keys span:last-child { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .tip { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .tip.warn { color: var(--warn); background: var(--warn-soft); padding: 7px 9px; border-radius: 8px; }
  button.link {
    width: 100%; margin-top: 10px; padding: 7px 10px; border: 1px solid var(--line);
    background: #fff; color: var(--fg); border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  button.link:hover { background: #f9fafb; border-color: var(--brand); color: var(--brand); }
  .hidden { display: none !important; }
  .cg { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
  .cg h2 { font-size: 12.5px; margin: 0 0 8px; color: var(--muted); font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
  .cg .picks { display: flex; gap: 6px; flex-wrap: wrap; }
  .cg .pk { width: 30px; height: 30px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; padding: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
  .cg .pk.on { border-color: var(--brand); box-shadow: inset 0 0 0 1px rgba(0,0,0,.12), 0 0 0 2px var(--brand-soft); }
  .cg .cust { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .cg input[type=color] { width: 32px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; }
  .cg .note { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
  <h1><span class="dot" id="dot"></span>键盘翻页助手</h1>

  <div class="row">
    <span class="k">全局启用</span>
    <label class="switch"><input type="checkbox" id="globalOn"><span class="slider"></span></label>
  </div>
  <div class="row">
    <span class="k">当前站点启用</span>
    <label class="switch"><input type="checkbox" id="hostOn"><span class="slider"></span></label>
  </div>

  <div class="keys">
    <div><span>下一页</span><span id="kNext">—</span></div>
    <div><span>上一页</span><span id="kPrev">—</span></div>
  </div>

  <div class="row" style="margin-top:6px">
    <span class="k">识别到「下一页」</span><span class="v" id="dNext">—</span>
  </div>
  <div class="row">
    <span class="k">识别到「上一页」</span><span class="v" id="dPrev">—</span>
  </div>

  <div class="tip hidden" id="tip"></div>

  <div class="cg" id="cgBox">
    <h2>
      <span>阅读配色</span>
      <label class="switch"><input type="checkbox" id="cgOn"><span class="slider"></span></label>
    </h2>
    <div class="picks" id="cgPicks">
      <button class="pk" data-p="green"  style="background:#c7dcc0" title="护眼绿"></button>
      <button class="pk" data-p="paper"  style="background:#f5ecd9" title="米黄纸"></button>
      <button class="pk" data-p="gray"   style="background:#e4e7ea" title="灰青"></button>
      <button class="pk" data-p="night"  style="background:#151515" title="夜间"></button>
      <button class="pk" data-p="white"  style="background:#ffffff" title="纯白"></button>
    </div>
    <div class="cust">
      <input type="color" id="cgBg" title="自定义背景色">
      <input type="color" id="cgFg" title="自定义文字色">
      <span class="note" id="cgNote">点色块切换；改自定义色会自动切到自定义</span>
    </div>
  </div>

  <button class="link" id="opt">打开完整设置</button>
  <button class="link" id="test" style="margin-top:6px">测试：模拟点击下一页</button>

  <script src="popup.js"></script>
</body>
</html>
